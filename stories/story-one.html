<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Lumen — Story</title>
  <style>
    @font-face { font-family: "Syne"; font-weight: 700; src: url("./fonts/syne-700.ttf") format("truetype"); }
    @font-face { font-family: "Syne"; font-weight: 800; src: url("./fonts/syne-800.ttf") format("truetype"); }
    @font-face { font-family: "Inter"; font-weight: 400; src: url("./fonts/inter-400.ttf") format("truetype"); }
    @font-face { font-family: "Inter"; font-weight: 500; src: url("./fonts/inter-500.ttf") format("truetype"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("./fonts/mono-500.ttf") format("truetype"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 600; src: url("./fonts/mono-600.ttf") format("truetype"); }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #05070a;
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #f3f6f9;
    }

    .story {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #05070a;
    }

    .aurora {
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0, 212, 255, 0.28), transparent 55%),
        radial-gradient(ellipse 45% 35% at 18% 62%, rgba(123, 97, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 40% 30% at 88% 78%, rgba(0, 180, 255, 0.1), transparent 50%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0, 0, 0, 0.5), transparent 40%);
      filter: blur(8px);
    }

    .mesh {
      position: absolute;
      inset: 0;
      opacity: 0.4;
      background:
        conic-gradient(from 210deg at 70% 20%, transparent 0deg, rgba(0, 212, 255, 0.07) 40deg, transparent 90deg),
        conic-gradient(from 40deg at 25% 70%, transparent 0deg, rgba(123, 97, 255, 0.06) 50deg, transparent 110deg);
      mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, #000 20%, transparent 80%);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 75% 60% at 50% 38%, #000 15%, transparent 75%);
      opacity: 0.55;
    }

    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 110% 90% at 50% 40%, transparent 25%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 118px 88px 108px;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      box-shadow: 0 0 32px rgba(0, 212, 255, 0.22);
    }

    .brand-name {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.12em;
      color: #f4fbff;
    }

    .pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(0, 212, 255, 0.85);
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(0, 212, 255, 0.22);
      background: rgba(0, 212, 255, 0.06);
      backdrop-filter: blur(12px);
    }

    .hero {
      margin-top: 88px;
    }

    h1 {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 84px;
      line-height: 0.98;
      letter-spacing: -0.04em;
      color: #f7fafc;
      max-width: 920px;
    }

    h1 .line2 {
      display: block;
      margin-top: 4px;
      background: linear-gradient(100deg, #ffffff 0%, #9fecff 38%, #00d4ff 62%, #8f7cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 28px rgba(0, 212, 255, 0.15));
    }

    .sub {
      margin-top: 30px;
      max-width: 700px;
      font-size: 28px;
      line-height: 1.45;
      color: rgba(243, 246, 249, 0.5);
      font-weight: 400;
    }

    /* Product surface */
    .surface {
      position: relative;
      margin-top: 72px;
      height: 720px;
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background:
        linear-gradient(165deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 35%, rgba(10,14,20,0.55) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35),
        0 40px 120px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(28px);
    }

    .surface::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 75% 20%, rgba(0, 212, 255, 0.18), transparent 60%),
        radial-gradient(ellipse 50% 45% at 20% 80%, rgba(123, 97, 255, 0.12), transparent 55%);
      pointer-events: none;
    }

    .surface-shine {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      opacity: 0.7;
    }

    .diagram {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .surface-caption {
      position: absolute;
      left: 40px;
      top: 36px;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(0, 212, 255, 0.7);
      z-index: 2;
    }

    .node-label {
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: rgba(247, 250, 252, 0.92);
      letter-spacing: -0.02em;
    }

    .node-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      fill: rgba(0, 212, 255, 0.65);
      letter-spacing: 0.08em;
    }

    .legend {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 36px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      z-index: 2;
    }

    .legend span {
      font-family: "JetBrains Mono", monospace;
      font-size: 15px;
      letter-spacing: 0.06em;
      color: rgba(243, 246, 249, 0.4);
    }

    .footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 40px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 74px;
      padding: 0 38px;
      border-radius: 999px;
      background: #f5f7fa;
      color: #070a0e;
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 25px;
      letter-spacing: -0.015em;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.1),
        0 18px 50px rgba(0, 212, 255, 0.14),
        0 8px 24px rgba(0,0,0,0.4);
    }

    .cta svg { width: 20px; height: 20px; }

    .url {
      font-family: "JetBrains Mono", monospace;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: rgba(232, 250, 255, 0.38);
    }
  </style>
</head>
<body>
  <article class="story">
    <div class="aurora"></div>
    <div class="mesh"></div>
    <div class="grid"></div>
    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="top">
        <div class="brand">
          <img src="./lumen-mark.svg" alt="" />
          <div class="brand-name">Lumen.studio</div>
        </div>
        <div class="pill">AI · Enterprise</div>
      </div>

      <div class="hero">
        <h1>
          Не сайты.
          <span class="line2">AI-продукты.</span>
        </h1>
        <p class="sub">
          Архитектура агентов, RAG и Mini Apps<br />
          с измеримым ROI — под ключ.
        </p>
      </div>

      <div class="surface">
        <div class="surface-shine"></div>
        <div class="surface-caption">Архитектура системы</div>

        <svg class="diagram" viewBox="0 0 904 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.55"/>
            </linearGradient>
            <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
            </linearGradient>
            <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="10" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <g fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.75">
            <path d="M452 210 C452 270, 220 290, 220 350" />
            <path d="M452 210 C452 270, 452 290, 452 350" />
            <path d="M452 210 C452 270, 684 290, 684 350" />
            <path d="M220 430 C220 490, 452 500, 452 560" />
            <path d="M452 430 C452 500, 452 520, 452 560" />
            <path d="M684 430 C684 490, 452 500, 452 560" />
          </g>

          <g filter="url(#softGlow)">
            <circle cx="452" cy="280" r="3.5" fill="#00D4FF"/>
            <circle cx="300" cy="310" r="3" fill="#7B61FF" opacity="0.9"/>
            <circle cx="604" cy="310" r="3" fill="#00D4FF" opacity="0.85"/>
            <circle cx="452" cy="500" r="3.5" fill="#7B61FF"/>
          </g>

          <g filter="url(#nodeGlow)">
            <rect x="332" y="148" width="240" height="92" rx="22" fill="url(#panel)" stroke="rgba(0,212,255,0.35)" stroke-width="1.2"/>
            <circle cx="368" cy="194" r="7" fill="#00D4FF"/>
            <text class="node-label" x="390" y="188">Оркестратор</text>
            <text class="node-sub" x="390" y="212">LUMEN CORE</text>
          </g>

          <g>
            <rect x="110" y="350" width="220" height="92" rx="22" fill="url(#panel)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
            <circle cx="146" cy="396" r="6" fill="#00D4FF"/>
            <text class="node-label" x="168" y="390">AI-агенты</text>
            <text class="node-sub" x="168" y="414">YANDEXGPT</text>

            <rect x="342" y="350" width="220" height="92" rx="22" fill="url(#panel)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
            <circle cx="378" cy="396" r="6" fill="#7B61FF"/>
            <text class="node-label" x="400" y="390">RAG Memory</text>
            <text class="node-sub" x="400" y="414">БАЗА ЗНАНИЙ</text>

            <rect x="574" y="350" width="220" height="92" rx="22" fill="url(#panel)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
            <circle cx="610" cy="396" r="6" fill="#00D4FF"/>
            <text class="node-label" x="632" y="390">Mini Apps</text>
            <text class="node-sub" x="632" y="414">TELEGRAM · MAX</text>
          </g>

          <g filter="url(#nodeGlow)">
            <rect x="282" y="560" width="340" height="92" rx="22" fill="url(#panel)" stroke="rgba(123,97,255,0.35)" stroke-width="1.2"/>
            <circle cx="318" cy="606" r="7" fill="#7B61FF"/>
            <text class="node-label" x="340" y="600">Бизнес-системы</text>
            <text class="node-sub" x="340" y="624">CRM · 1С · АВТОМАТИЗАЦИЯ</text>
          </g>
        </svg>

        <div class="legend">
          <span>01 Диагностика</span>
          <span>02 Архитектура</span>
          <span>03 Запуск</span>
        </div>
      </div>

      <div class="footer">
        <div class="cta">
          Начать проект
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
        </div>
        <div class="url">lumenstudio.su</div>
      </div>
    </div>
  </article>
</body>
</html>
