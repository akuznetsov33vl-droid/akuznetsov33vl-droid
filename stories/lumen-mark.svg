<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lumen.studio">
  <defs>
    <linearGradient id="beam" x1="18%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#3B9DFF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0D1117"/>
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="url(#beam)" stroke-width="3" opacity="0.28"/>

  <circle cx="368" cy="144" r="72" fill="url(#glow)" filter="url(#soft)"/>

  <!-- L — «луч света» Lumen -->
  <path
    d="M156 132 V332 H332"
    fill="none"
    stroke="url(#beam)"
    stroke-width="58"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="332" cy="132" r="26" fill="#00D4FF"/>
  <circle cx="332" cy="132" r="14" fill="#E8FAFF"/>
</svg>
